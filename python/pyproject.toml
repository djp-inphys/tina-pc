[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tina"
version = "0.1.0"
description = "Python bindings and CLI for the TINA vision library"
readme = "../README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.scripts]
tina = "tina.cli.main:cli"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
